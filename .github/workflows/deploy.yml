name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/premarketprice
            git fetch origin main
            git reset --hard origin/main
            npm ci --production=false
            npx prisma generate
            npx prisma db push --accept-data-loss
            npm run build
            pm2 restart premarketprice || pm2 start ecosystem.config.cjs --only premarketprice --env development
            sleep 10
            curl -s -o /dev/null -w 'homepage=%{http_code}\n' http://localhost:3001/
            curl -s -o /dev/null -w 'health=%{http_code}\n' http://localhost:3001/api/health
            curl -s -o /dev/null -w 'stocks=%{http_code}\n' http://localhost:3001/api/stocks/optimized
            curl -s -o /dev/null -w 'earnings=%{http_code}\n' http://localhost:3001/api/earnings/dates
