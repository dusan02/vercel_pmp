name: Deploy to Production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Queue deploys instead of running two overlapping builds on the small VPS
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy if CI succeeded (not if it failed/cancelled)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -e
            cd /var/www/premarketprice

            # Run the deploy DETACHED (setsid + nohup): if this SSH session
            # drops mid-build (flaky network, server-side connection cleanup),
            # the deploy keeps running on the VPS and we simply poll for it.
            LOG=/tmp/pmp-deploy-$(date +%Y%m%d-%H%M%S).log
            setsid nohup bash scripts/vps-deploy.sh > "$LOG" 2>&1 &
            DPID=$!
            echo "deploy PID $DPID, log $LOG"

            # Poll up to ~25 min for the detached deploy to finish
            FINISHED=0
            for i in $(seq 1 150); do
              sleep 10
              if ! kill -0 "$DPID" 2>/dev/null; then FINISHED=1; break; fi
            done
            if [ "$FINISHED" != "1" ]; then
              echo "deploy still running after 25 min — dumping log tail"
              tail -40 "$LOG"
              exit 1
            fi

            echo "=== deploy log (tail) ==="
            tail -40 "$LOG"
            grep -q "=== Done ===" "$LOG" || {
              echo "deploy script failed — see log above"
              exit 1
            }
            echo "deploy finished OK"
